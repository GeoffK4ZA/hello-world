# Digital Geoff - Docker Compose Configuration
# For local development and self-hosted deployment

version: '3.8'

services:
  # Main Digital Geoff Agent
  digital-geoff:
    build: .
    container_name: digital-geoff
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Anthropic
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

      # Microsoft 365
      - MS_CLIENT_ID=${MS_CLIENT_ID}
      - MS_CLIENT_SECRET=${MS_CLIENT_SECRET}
      - MS_TENANT_ID=${MS_TENANT_ID}
      - MS_USER_EMAIL=${MS_USER_EMAIL}

      # Asana
      - ASANA_TOKEN=${ASANA_TOKEN}

      # Slack
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
      - SLACK_DEFAULT_CHANNEL=${SLACK_DEFAULT_CHANNEL:-general}

      # Twilio
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER}
      - TWILIO_TO_NUMBER=${TWILIO_TO_NUMBER}

      # Google
      - GOOGLE_CREDENTIALS_PATH=/app/credentials/google-credentials.json

      # Notion
      - NOTION_API_KEY=${NOTION_API_KEY}

      # GitHub
      - GITHUB_TOKEN=${GITHUB_TOKEN}

      # Redis (for production memory/checkpoints)
      - REDIS_URL=redis://redis:6379

      # Neo4j (for production knowledge graph)
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-digitalgeoff}
    volumes:
      - ./credentials:/app/credentials:ro
      - digitalgeoff-data:/app/data
    depends_on:
      - redis
      - neo4j
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Redis - For memory and checkpoint storage
  redis:
    image: redis:7-alpine
    container_name: digital-geoff-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j - For knowledge graph
  neo4j:
    image: neo4j:5
    container_name: digital-geoff-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-digitalgeoff}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    ports:
      - "7474:7474"  # Browser
      - "7687:7687"  # Bolt
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Qdrant - For vector memory (alternative to Chroma)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: digital-geoff-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  digitalgeoff-data:
  redis-data:
  neo4j-data:
  neo4j-logs:
  qdrant-data:

networks:
  default:
    name: digital-geoff-network
