# Digital Geoff - Zero Cost Edition
#
# This configuration uses only FREE components:
# - Groq API (free tier: 14,400 requests/day)
# - Ollama (local LLM, unlimited)
# - SQLite (file-based, free)
# - ChromaDB (local vectors, free)
# - Telegram Bot (free, unlimited)
#
# Estimated cost: $0/month

version: '3.8'

services:
  # Main Digital Geoff Agent
  digital-geoff:
    build:
      context: .
      dockerfile: Dockerfile.zero-cost
    container_name: digital-geoff
    restart: always
    ports:
      - "8000:8000"
    environment:
      # LLM Configuration (tiered routing)
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OLLAMA_HOST=http://host.docker.internal:11434
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}  # Optional fallback

      # Telegram (FREE - replaces Twilio SMS)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
      - TELEGRAM_PRIMARY_CHAT_ID=${TELEGRAM_PRIMARY_CHAT_ID}

      # Storage (all local/free)
      - SQLITE_PATH=/data/sqlite/digital_geoff.db
      - CHROMA_PATH=/data/chroma
      - KNOWLEDGE_PATH=/data/knowledge

      # Optional: Microsoft 365 (free with existing subscription)
      - MS_CLIENT_ID=${MS_CLIENT_ID:-}
      - MS_CLIENT_SECRET=${MS_CLIENT_SECRET:-}
      - MS_TENANT_ID=${MS_TENANT_ID:-}
      - MS_USER_EMAIL=${MS_USER_EMAIL:-}

      # Optional: Asana (free tier available)
      - ASANA_TOKEN=${ASANA_TOKEN:-}

      # Optional: Slack (free for small teams)
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-}

      # Optional: GitHub (free)
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}

      # Optional: Notion (free tier available)
      - NOTION_API_KEY=${NOTION_API_KEY:-}

    volumes:
      - ./data/sqlite:/data/sqlite
      - ./data/chroma:/data/chroma
      - ./data/knowledge:/data/knowledge
      - ./data/logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G  # Plenty of headroom on Oracle's 24GB
        reservations:
          memory: 512M

  # ChromaDB for vector storage (optional standalone)
  # Uncomment if you want ChromaDB as separate service
  # chroma:
  #   image: chromadb/chroma:latest
  #   container_name: digital-geoff-chroma
  #   restart: always
  #   volumes:
  #     - ./data/chroma:/chroma/chroma
  #   ports:
  #     - "8001:8000"

  # Caddy for automatic HTTPS (free Let's Encrypt)
  # Uncomment if you have a domain
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: digital-geoff-caddy
  #   restart: always
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     - digital-geoff

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
    name: digital-geoff-network
